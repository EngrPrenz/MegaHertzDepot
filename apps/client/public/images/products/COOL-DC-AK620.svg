  <rect x="145" y="110" width="125" height="275" rx="8" fill="#27272a" stroke="#52525b" stroke-width="2.5"/>
  <rect x="330" y="110" width="125" height="275" rx="8" fill="#27272a" stroke="#52525b" stroke-width="2.5"/>
