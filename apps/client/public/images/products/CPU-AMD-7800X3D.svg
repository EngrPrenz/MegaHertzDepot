<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#292524"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </radialGradient>
    <linearGradient id="ihs" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d6d3d1"/>
      <stop offset="50%" stop-color="#a8a29e"/>
      <stop offset="100%" stop-color="#57534e"/>
    </linearGradient>
    <linearGradient id="pcb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <circle cx="300" cy="280" r="210" fill="#f59e0b" opacity="0.06"/>
  <!-- AM5 Substrate PCB -->
  <rect x="135" y="115" width="330" height="330" rx="18" fill="url(#pcb)" stroke="#10b981" stroke-width="3" stroke-opacity="0.4"/>
  <!-- Gold contact pads on edges -->
  <g fill="#fbbf24" opacity="0.85">
    <rect x="175" y="122" width="12" height="8" rx="2"/><rect x="195" y="122" width="12" height="8" rx="2"/><rect x="215" y="122" width="12" height="8" rx="2"/>
    <rect x="375" y="122" width="12" height="8" rx="2"/><rect x="395" y="122" width="12" height="8" rx="2"/><rect x="415" y="122" width="12" height="8" rx="2"/>
    <rect x="175" y="430" width="12" height="8" rx="2"/><rect x="195" y="430" width="12" height="8" rx="2"/><rect x="215" y="430" width="12" height="8" rx="2"/>
    <rect x="375" y="430" width="12" height="8" rx="2"/><rect x="395" y="430" width="12" height="8" rx="2"/><rect x="415" y="430" width="12" height="8" rx="2"/>
  </g>
  <!-- AM5 Octopus Heatspreader (IHS) -->
  <path d="M190,145 H410 V185 H435 V235 H410 V325 H435 V375 H410 V415 H190 V375 H165 V325 H190 V235 H165 V185 H190 Z" fill="url(#ihs)" stroke="#e7e5e4" stroke-width="2.5"/>
  <rect x="205" y="175" width="190" height="210" rx="10" fill="#292524" opacity="0.18"/>
  <!-- Pin 1 Gold Triangle -->
  <polygon points="145,435 162,435 145,418" fill="#fbbf24"/>
  <!-- Laser Etched Branding -->
  <text x="300" y="245" text-anchor="middle" fill="#1c1917" font-family="monospace, sans-serif" font-weight="900" font-size="28" letter-spacing="2">AMD RYZEN</text>
  <rect x="230" y="260" width="140" height="28" rx="6" fill="url(#amber)"/>
  <text x="300" y="279" text-anchor="middle" fill="#0c0a09" font-family="monospace, sans-serif" font-weight="900" font-size="16" letter-spacing="1.5">7 7800X3D</text>
  <text x="300" y="318" text-anchor="middle" fill="#44403c" font-family="monospace" font-weight="700" font-size="13">3D V-CACHE • AM5</text>
  <text x="300" y="340" text-anchor="middle" fill="#57534e" font-family="monospace" font-size="11">8 CORES / 16 THREADS</text>
  <!-- Bottom Label Pill -->
  <rect x="120" y="490" width="360" height="54" rx="14" fill="#1c1917" stroke="#44403c" stroke-width="1.5"/>
  <text x="300" y="514" text-anchor="middle" fill="#f5f5f4" font-family="sans-serif" font-weight="800" font-size="15">AMD Ryzen 7 7800X3D</text>
  <text x="300" y="534" text-anchor="middle" fill="#fbbf24" font-family="monospace" font-weight="700" font-size="12">SOCKET AM5 • 96MB L3 3D V-CACHE • 120W</text>
</svg>