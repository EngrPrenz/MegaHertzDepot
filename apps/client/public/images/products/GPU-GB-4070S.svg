<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <rect width="600" height="600" fill="#0c0a09"/>
  <circle cx="300" cy="260" r="220" fill="#f59e0b" opacity="0.06"/>
  <!-- PCIe Bracket -->
  <path d="M55,155 H75 V395 H55 Z" fill="#a1a1aa"/>
  <!-- Triple Fan GPU Shroud -->
  <rect x="70" y="175" width="470" height="185" rx="16" fill="#18181b" stroke="#52525b" stroke-width="3"/>
  <rect x="85" y="163" width="440" height="14" rx="4" fill="#27272a" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="305" y="173" text-anchor="middle" fill="#fbbf24" font-family="monospace" font-weight="900" font-size="10" letter-spacing="2">GEFORCE RTX • GIGABYTE WINDFORCE</text>
  <!-- 3 Windforce Fans -->
  <g stroke="#52525b" stroke-width="2" fill="#09090b">
    <circle cx="155" cy="268" r="64"/>
    <circle cx="305" cy="268" r="64"/>
    <circle cx="455" cy="268" r="64"/>
  </g>
  <g fill="#27272a" stroke="#f59e0b" stroke-width="1.5">
    <circle cx="155" cy="268" r="20"/>
    <circle cx="305" cy="268" r="20"/>
    <circle cx="455" cy="268" r="20"/>
  </g>
  <!-- PCIe 4.0 x16 Gold Finger -->
  <rect x="135" y="360" width="210" height="14" rx="3" fill="#fbbf24"/>
  <!-- Badge -->
  <rect x="200" y="405" width="200" height="32" rx="8" fill="#f59e0b"/>
  <text x="300" y="426" text-anchor="middle" fill="#0c0a09" font-family="monospace" font-weight="900" font-size="15">RTX 4070 SUPER</text>
  <!-- Bottom Label -->
  <rect x="90" y="490" width="420" height="54" rx="14" fill="#1c1917" stroke="#44403c" stroke-width="1.5"/>
  <text x="300" y="514" text-anchor="middle" fill="#f5f5f4" font-family="sans-serif" font-weight="800" font-size="15">GIGABYTE RTX 4070 SUPER Windforce</text>
  <text x="300" y="534" text-anchor="middle" fill="#fbbf24" font-family="monospace" font-weight="700" font-size="12">12GB GDDR6X • DLSS 3.5 • 220W</text>
</svg>