<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <rect width="600" height="600" fill="#0c0a09"/>
  <circle cx="300" cy="270" r="220" fill="#f59e0b" opacity="0.05"/>
  <!-- ATX PCB -->
  <rect x="130" y="75" width="340" height="395" rx="12" fill="#18181b" stroke="#52525b" stroke-width="3"/>
  <!-- Silver/White ROG VRM Heatsinks -->
  <rect x="145" y="95" width="65" height="175" rx="6" fill="#e4e4e7" stroke="#a1a1aa" stroke-width="2"/>
  <rect x="215" y="90" width="145" height="45" rx="6" fill="#d4d4d8" stroke="#a1a1aa" stroke-width="2"/>
  <text x="177" y="190" text-anchor="middle" fill="#18181b" font-family="monospace" font-weight="900" font-size="14" transform="rotate(-90 177 190)">ROG STRIX</text>
  <!-- AM5 CPU Socket -->
  <rect x="240" y="155" width="95" height="95" rx="8" fill="#27272a" stroke="#f59e0b" stroke-width="2.5"/>
  <rect x="255" y="170" width="65" height="65" rx="4" fill="#3f3f46"/>
  <!-- 4x DDR5 DIMM Slots -->
  <g fill="#27272a" stroke="#71717a" stroke-width="1.5">
    <rect x="375" y="105" width="12" height="160" rx="2"/>
    <rect x="393" y="105" width="12" height="160" rx="2"/>
    <rect x="411" y="105" width="12" height="160" rx="2"/>
    <rect x="429" y="105" width="12" height="160" rx="2"/>
  </g>
  <!-- PCIe 5.0 Steel Slot & M.2 Heatsinks -->
  <rect x="160" y="295" width="240" height="14" rx="3" fill="#d4d4d8"/>
  <rect x="160" y="320" width="210" height="32" rx="5" fill="#d4d4d8" stroke="#a1a1aa"/>
  <text x="265" y="340" text-anchor="middle" fill="#18181b" font-family="monospace" font-weight="800" font-size="11">M.2 PCIe 5.0 HEATSINK</text>
  <rect x="160" y="368" width="240" height="12" rx="3" fill="#3f3f46"/>
  <rect x="160" y="392" width="285" height="55" rx="6" fill="#e4e4e7"/>
  <text x="302" y="425" text-anchor="middle" fill="#09090b" font-family="monospace" font-weight="900" font-size="16">B650-A GAMING WIFI</text>
  <!-- Bottom Label -->
  <rect x="110" y="490" width="380" height="54" rx="14" fill="#1c1917" stroke="#44403c" stroke-width="1.5"/>
  <text x="300" y="514" text-anchor="middle" fill="#f5f5f4" font-family="sans-serif" font-weight="800" font-size="15">ASUS ROG Strix B650-A WiFi</text>
  <text x="300" y="534" text-anchor="middle" fill="#fbbf24" font-family="monospace" font-weight="700" font-size="12">AM5 • DDR5 • ATX • WIFI 6E</text>
</svg>