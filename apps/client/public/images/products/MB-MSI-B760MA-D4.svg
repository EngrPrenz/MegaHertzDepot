<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <rect width="600" height="600" fill="#0c0a09"/>
  <!-- mATX Square-ish PCB -->
  <rect x="135" y="105" width="330" height="350" rx="12" fill="#171717" stroke="#404040" stroke-width="3"/>
  <!-- VRM Heatsinks -->
  <rect x="150" y="125" width="58" height="150" rx="5" fill="#525252" stroke="#737373" stroke-width="2"/>
  <rect x="218" y="120" width="130" height="38" rx="5" fill="#525252" stroke="#737373" stroke-width="2"/>
  <text x="179" y="205" text-anchor="middle" fill="#e5e5e5" font-family="monospace" font-weight="900" font-size="13" transform="rotate(-90 179 205)">MSI PRO</text>
  <!-- LGA1700 Socket -->
  <rect x="238" y="175" width="85" height="95" rx="6" fill="#262626" stroke="#38bdf8" stroke-width="2"/>
  <!-- 4x DDR4 Slots -->
  <g fill="#262626" stroke="#525252" stroke-width="1.5">
    <rect x="365" y="130" width="11" height="145" rx="2"/>
    <rect x="382" y="130" width="11" height="145" rx="2"/>
    <rect x="399" y="130" width="11" height="145" rx="2"/>
    <rect x="416" y="130" width="11" height="145" rx="2"/>
  </g>
  <!-- M.2 Shield Frozr & Chipset -->
  <rect x="160" y="300" width="220" height="14" rx="3" fill="#a3a3a3"/>
  <rect x="160" y="328" width="195" height="32" rx="5" fill="#404040" stroke="#737373"/>
  <text x="257" y="348" text-anchor="middle" fill="#e5e5e5" font-family="monospace" font-weight="700" font-size="11">M.2 SHIELD FROZR</text>
  <rect x="345" y="365" width="95" height="65" rx="6" fill="#525252" stroke="#737373"/>
  <text x="392" y="402" text-anchor="middle" fill="#ffffff" font-family="monospace" font-weight="900" font-size="14">B760M</text>
  <!-- Bottom Label -->
  <rect x="110" y="490" width="380" height="54" rx="14" fill="#1c1917" stroke="#44403c" stroke-width="1.5"/>
  <text x="300" y="514" text-anchor="middle" fill="#f5f5f4" font-family="sans-serif" font-weight="800" font-size="15">MSI PRO B760M-A WiFi DDR4</text>
  <text x="300" y="534" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-weight="700" font-size="12">LGA1700 • DDR4 • mATX • WIFI 6E</text>
</svg>