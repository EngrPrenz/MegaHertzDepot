<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#31102f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="#0c0a09"/>
  <!-- Monitor Stand -->
  <rect x="282" y="340" width="36" height="85" fill="#27272a"/>
  <path d="M200,435 L300,415 L400,435 L385,448 L300,432 L215,448 Z" fill="#3f3f46" stroke="#f59e0b" stroke-width="1.5"/>
  <!-- 27" QHD Bezel & Screen -->
  <rect x="75" y="100" width="450" height="260" rx="10" fill="#18181b" stroke="#52525b" stroke-width="3"/>
  <rect x="87" y="112" width="426" height="232" rx="4" fill="url(#screen)"/>
  <!-- On-screen HUD Specs -->
  <text x="300" y="210" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="28" letter-spacing="2">TUF GAMING</text>
  <rect x="195" y="230" width="210" height="34" rx="8" fill="#f59e0b"/>
  <text x="300" y="252" text-anchor="middle" fill="#0c0a09" font-family="monospace" font-weight="900" font-size="16">27" QHD • 180Hz</text>
  <text x="300" y="290" text-anchor="middle" fill="#fde68a" font-family="monospace" font-weight="700" font-size="12">FAST IPS • 1ms GTG • G-SYNC</text>
  <!-- Bottom Label -->
  <rect x="90" y="490" width="420" height="54" rx="14" fill="#1c1917" stroke="#44403c" stroke-width="1.5"/>
  <text x="300" y="514" text-anchor="middle" fill="#f5f5f4" font-family="sans-serif" font-weight="800" font-size="15">ASUS TUF Gaming VG27AQ3A 27"</text>
  <text x="300" y="534" text-anchor="middle" fill="#fbbf24" font-family="monospace" font-weight="700" font-size="12">2560x1440 QHD • 180Hz IPS • 1ms ELMB</text>
</svg>