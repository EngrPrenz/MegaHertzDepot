<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <rect width="600" height="600" fill="#0c0a09"/>
  <!-- M.2 2280 Stick -->
  <rect x="65" y="210" width="470" height="135" rx="10" fill="#171717" stroke="#404040" stroke-width="3"/>
  <!-- M-Key Gold Connector -->
  <rect x="520" y="222" width="15" height="75" rx="2" fill="#fbbf24"/>
  <rect x="520" y="307" width="15" height="25" rx="2" fill="#fbbf24"/>
  <!-- Semicircle Mounting Notch -->
  <circle cx="65" cy="277" r="14" fill="#0c0a09" stroke="#fbbf24" stroke-width="2"/>
  <!-- Samsung Label Sticker -->
  <rect x="105" y="225" width="390" height="105" rx="6" fill="#09090b" stroke="#dc2626" stroke-width="2"/>
  <text x="130" y="262" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="24" letter-spacing="2">SAMSUNG</text>
  <text x="130" y="295" fill="#ef4444" font-family="monospace" font-weight="900" font-size="26">990 PRO</text>
  <rect x="370" y="245" width="105" height="65" rx="8" fill="#1c1917" stroke="#ef4444" stroke-width="1.5"/>
  <text x="422" y="278" text-anchor="middle" fill="#ffffff" font-family="monospace" font-weight="900" font-size="22">1TB</text>
  <text x="422" y="298" text-anchor="middle" fill="#a8a29e" font-family="monospace" font-size="10">PCIe 4.0 NVMe</text>
  <!-- Bottom Label -->
  <rect x="100" y="490" width="400" height="54" rx="14" fill="#1c1917" stroke="#44403c" stroke-width="1.5"/>
  <text x="300" y="514" text-anchor="middle" fill="#f5f5f4" font-family="sans-serif" font-weight="800" font-size="15">Samsung 990 PRO 1TB NVMe M.2</text>
  <text x="300" y="534" text-anchor="middle" fill="#fbbf24" font-family="monospace" font-weight="700" font-size="12">7,450 MB/s READ • PCIe 4.0 x4 • M.2 2280</text>
</svg>